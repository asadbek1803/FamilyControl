name: family_control_app
description: "FamilyControl - Ota-onalar nazorat ilovasi"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP & Networking
  http: ^1.4.0
  dio: ^5.7.0

  # State Management
  provider: ^6.1.2

  # Local Storage / Offline
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.3.3

  # Connectivity
  connectivity_plus: ^6.1.4

  # Secure Storage (for tokens)
  flutter_secure_storage: ^9.2.4

  # UI
  fl_chart: ^0.70.2
  google_maps_flutter: ^2.10.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1

  # Utils
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
